name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: PHP ${{ matrix.php }} on ${{ matrix.server }}
    runs-on: ${{ matrix.os }}
    env:
      RESP3_TEST_HOST: 127.0.0.1
      RESP3_TEST_PORT: 6379
    services:
      redis:
        image: ${{ matrix.server }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "${{ matrix.cli }} ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        os: [ubuntu-24.04]
        server: ['valkey/valkey:8.1', 'valkey/valkey:9.1', 'redis:8.10']
        include:
          - server: 'valkey/valkey:8.1'
            cli: valkey-cli
          - server: 'valkey/valkey:9.1'
            cli: valkey-cli
          - server: 'redis:8.10'
            cli: redis-cli

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
          extensions: apcu
          ini-values: apc.enable_cli=1
          coverage: none

      - name: Build ext-resp3 from source
        run: |
          git clone --depth 1 --branch v0.2.0 https://github.com/webpatser/php-resp3.git "$RUNNER_TEMP/php-resp3"
          cd "$RUNNER_TEMP/php-resp3"
          phpize
          ./configure --enable-resp3
          make
          sudo make install
          INI=$(php -r 'echo php_ini_loaded_file();')
          echo "extension=resp3" | sudo tee -a "$INI"
          php -m | grep resp3

      - name: composer install
        run: composer install --no-progress --prefer-dist

      - name: composer validate
        run: composer validate --strict

      - name: Unit tests
        run: vendor/bin/phpunit --testsuite=Unit

      - name: Feature tests
        run: vendor/bin/phpunit --testsuite=Feature

  cluster-test:
    name: Cluster tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
          extensions: apcu
          ini-values: apc.enable_cli=1
          coverage: none

      - name: Build ext-resp3 from source
        run: |
          git clone --depth 1 --branch v0.2.0 https://github.com/webpatser/php-resp3.git "$RUNNER_TEMP/php-resp3"
          cd "$RUNNER_TEMP/php-resp3"
          phpize
          ./configure --enable-resp3
          make
          sudo make install
          INI=$(php -r 'echo php_ini_loaded_file();')
          echo "extension=resp3" | sudo tee -a "$INI"
          php -m | grep resp3

      - name: Boot cluster
        run: |
          docker compose -f tests/cluster/docker-compose.yml up -d --wait
          # Wait for cluster-init to finish; it exits when topology is ready.
          for _ in $(seq 1 30); do
            state=$(docker compose -f tests/cluster/docker-compose.yml ps -a --status=exited --services | grep -c cluster-init || true)
            if [ "$state" = "1" ]; then break; fi
            sleep 1
          done
          docker compose -f tests/cluster/docker-compose.yml logs cluster-init | tail -20

      - name: composer install
        run: composer install --no-progress --prefer-dist

      - name: Cluster tests
        run: vendor/bin/phpunit tests/Feature/ClusterTest.php tests/Feature/ClusterReplicaTest.php

      - name: Tear cluster down
        if: always()
        run: docker compose -f tests/cluster/docker-compose.yml down -v
