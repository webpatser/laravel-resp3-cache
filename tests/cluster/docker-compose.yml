# 6-node Valkey cluster (3 masters + 3 replicas) for local and CI tests.
#
# Networking: the nodes talk to each other over the compose bridge network
# (the cluster bus uses each container's own bridge IP), while
# --cluster-announce-client-ipv4 makes every node advertise 127.0.0.1 to
# clients in MOVED/ASK redirects, CLUSTER SHARDS and CLUSTER SLOTS. Each
# node's client port is mapped 1:1 to the host (7100-7105), so a client on
# the host reaches every advertised address. The same setup works on Linux
# (CI) and on macOS Docker Desktop.
#
# Do not use --cluster-announce-ip 127.0.0.1 here: that also changes the
# bus address, and inside a container 127.0.0.1 is the container itself,
# so the nodes never finish the CLUSTER MEET handshake.

services:
  valkey-1:
    image: valkey/valkey:8
    container_name: r3-cluster-1
    ports: ["7100:7100"]
    command: >-
      valkey-server
      --port 7100
      --cluster-enabled yes
      --cluster-config-file /tmp/nodes-7100.conf
      --cluster-node-timeout 5000
      --cluster-announce-client-ipv4 127.0.0.1
      --appendonly yes
      --protected-mode no
    healthcheck:
      test: ["CMD", "valkey-cli", "-p", "7100", "ping"]
      interval: 2s
      retries: 10

  valkey-2:
    image: valkey/valkey:8
    container_name: r3-cluster-2
    ports: ["7101:7101"]
    command: >-
      valkey-server
      --port 7101 --cluster-enabled yes
      --cluster-config-file /tmp/nodes-7101.conf
      --cluster-node-timeout 5000
      --cluster-announce-client-ipv4 127.0.0.1
      --appendonly yes --protected-mode no
    healthcheck:
      test: ["CMD", "valkey-cli", "-p", "7101", "ping"]
      interval: 2s
      retries: 10

  valkey-3:
    image: valkey/valkey:8
    container_name: r3-cluster-3
    ports: ["7102:7102"]
    command: >-
      valkey-server
      --port 7102 --cluster-enabled yes
      --cluster-config-file /tmp/nodes-7102.conf
      --cluster-node-timeout 5000
      --cluster-announce-client-ipv4 127.0.0.1
      --appendonly yes --protected-mode no
    healthcheck:
      test: ["CMD", "valkey-cli", "-p", "7102", "ping"]
      interval: 2s
      retries: 10

  valkey-4:
    image: valkey/valkey:8
    container_name: r3-cluster-4
    ports: ["7103:7103"]
    command: >-
      valkey-server
      --port 7103 --cluster-enabled yes
      --cluster-config-file /tmp/nodes-7103.conf
      --cluster-node-timeout 5000
      --cluster-announce-client-ipv4 127.0.0.1
      --appendonly yes --protected-mode no
    healthcheck:
      test: ["CMD", "valkey-cli", "-p", "7103", "ping"]
      interval: 2s
      retries: 10

  valkey-5:
    image: valkey/valkey:8
    container_name: r3-cluster-5
    ports: ["7104:7104"]
    command: >-
      valkey-server
      --port 7104 --cluster-enabled yes
      --cluster-config-file /tmp/nodes-7104.conf
      --cluster-node-timeout 5000
      --cluster-announce-client-ipv4 127.0.0.1
      --appendonly yes --protected-mode no
    healthcheck:
      test: ["CMD", "valkey-cli", "-p", "7104", "ping"]
      interval: 2s
      retries: 10

  valkey-6:
    image: valkey/valkey:8
    container_name: r3-cluster-6
    ports: ["7105:7105"]
    command: >-
      valkey-server
      --port 7105 --cluster-enabled yes
      --cluster-config-file /tmp/nodes-7105.conf
      --cluster-node-timeout 5000
      --cluster-announce-client-ipv4 127.0.0.1
      --appendonly yes --protected-mode no
    healthcheck:
      test: ["CMD", "valkey-cli", "-p", "7105", "ping"]
      interval: 2s
      retries: 10

  cluster-init:
    image: valkey/valkey:8
    depends_on:
      valkey-1: { condition: service_healthy }
      valkey-2: { condition: service_healthy }
      valkey-3: { condition: service_healthy }
      valkey-4: { condition: service_healthy }
      valkey-5: { condition: service_healthy }
      valkey-6: { condition: service_healthy }
    command:
      - sh
      - -c
      - "echo yes | valkey-cli --cluster create r3-cluster-1:7100 r3-cluster-2:7101 r3-cluster-3:7102 r3-cluster-4:7103 r3-cluster-5:7104 r3-cluster-6:7105 --cluster-replicas 1"
